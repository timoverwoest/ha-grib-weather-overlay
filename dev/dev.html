<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<!-- Same as Home Assistant's page: no Referer on cross-origin requests unless an
     element asks for one (the tile layers do; OpenStreetMap requires it). -->
<meta name="referrer" content="same-origin" />
<title>grib-overlay-card dev harness</title>
<style>
  body { font-family: sans-serif; background: #eee; margin: 0; padding: 24px; }
  h1 { font-size: 1rem; color: #555; }
  h2 { font-size: 0.95rem; color: #555; max-width: 700px; margin: 28px auto 8px; }
  grib-overlay-card, grib-overlay-compare-card, grib-overlay-weathermap-card { display: block; max-width: 700px; margin: 0 auto; }
</style>
</head>
<body>
<h1>grib-overlay-card dev harness (mock API, no Home Assistant)</h1>
<grib-overlay-card id="card"></grib-overlay-card>

<h2>grib-overlay-compare-card (modelvergelijking)</h2>
<grib-overlay-compare-card id="compare"></grib-overlay-compare-card>

<h2>grib-overlay-weathermap-card (KNMI-weerkaart)</h2>
<grib-overlay-weathermap-card id="wm"></grib-overlay-weathermap-card>

<script>
  // Minimal <ha-card> stand-in that mimics the real element: its own shadow
  // with :host{display:block}, and crucially NO inline `display` on the host,
  // so the card's own `ha-card{display:flex}` rule can override it the same
  // way it does in real Home Assistant.
  if (!customElements.get("ha-card")) {
    customElements.define("ha-card", class extends HTMLElement {
      constructor() {
        super();
        const s = this.attachShadow({ mode: "open" });
        s.innerHTML =
          "<style>:host{display:block;border-radius:12px;" +
          "box-shadow:0 2px 6px rgba(0,0,0,0.25);background:#fff;overflow:hidden}</style>" +
          "<slot></slot>";
      }
    });
  }
</script>
<script src="/grib_overlay_static/grib-overlay-card.js"></script>
<script>
  // ?lang=en / ?lang=nl mimics the Home Assistant user's profile language,
  // which the cards read from hass.locale.language. Defaults to Dutch, like
  // this harness page itself.
  const devParams = new URLSearchParams(location.search);
  const devLang = devParams.get("lang") || "nl";
  // ?map_tiles=1 imitates Home Assistant 2026.9+'s tile proxy (core map_tiles):
  // the first token handed out is already expired, so the renewal is exercised.
  // Without it the harness behaves like an older Home Assistant (direct OSM).
  const mapTiles = devParams.get("map_tiles") === "1";
  let tokenCount = 0;
  const baseMap = {};
  document.documentElement.lang = devLang;
  const hass = {
    locale: { language: devLang },
    language: devLang,
    callWS: async (msg) => {
      if (msg.type === "map_tiles/access_token" && mapTiles) {
        tokenCount += 1;
        return { token: tokenCount === 1 ? "mock-expired" : `mock-${tokenCount}` };
      }
      throw { code: "unknown_command", message: `Unknown command ${msg.type}` };
    },
    hassUrl: (path = "") => new URL(path, location.origin).toString(),
    callApi: async (method, path) => {
      const resp = await fetch("/api/" + path, { method });
      if (!resp.ok) throw new Error(`${method} /api/${path} -> ${resp.status}`);
      return resp.json();
    },
  };
  const card = document.getElementById("card");
  card.setConfig({ type: "custom:grib-overlay-card", ...baseMap });
  card.hass = hass;

  const compare = document.getElementById("compare");
  compare.setConfig({ type: "custom:grib-overlay-compare-card", center: [52.4, 4.5], zoom: 8, ...baseMap });
  compare.hass = hass;

  const wm = document.getElementById("wm");
  wm.setConfig({ type: "custom:grib-overlay-weathermap-card" });
  wm.hass = hass;
</script>
</body>
</html>
