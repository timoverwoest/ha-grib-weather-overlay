name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format github
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check --diff

  style:
    name: Style (Prettier and ESLint of the Home Assistant frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The versions the Home Assistant frontend uses; only for this check, the card itself
      # has no dependencies.
      - name: Install Prettier and ESLint
        run: npm install --no-save --no-package-lock prettier@3.10.1 eslint@10.15.0 @eslint/js@10.0.1
      - name: Prettier
        run: npx prettier --check custom_components/grib_overlay/www/grib-overlay-card.js eslint.config.mjs
      - name: ESLint
        run: npx eslint custom_components/grib_overlay/www/grib-overlay-card.js

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
